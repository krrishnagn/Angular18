

<div *ngIf="!FormVisible"  class="mt-1">
  

  <!-- Search Box -->
  <div class="row mb-3 justify-content-end">
    <div class="col-md-8 ">
        <h2 class="mb-2">Employee List</h2>
    </div>
    <div class="col-md-4">
      <form class="form-inline">
        <div class="input-group">
          <input id="input" type="text" class="form-control" placeholder="Search by First Name" [(ngModel)]="searchTerm" name="searchTerm" (input)="searchEmployees()">
          <button type="button" class="btn btn-outline-primary" (click)="clearSearch()">Clear</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Table -->
  <div class="table-responsive">
    <table class="table table-striped table-bordered">
      <thead class="thead-dark">
        <tr>
          <th scope="col">First Name</th>
          <th scope="col">Last Name</th>
          <th scope="col">DOB</th>
          <th scope="col">Mail</th>
          <th scope="col">Position</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let emp of filteredEmployees; let i = index">
          <td>{{ emp.firstName }}</td>
          <td>{{ emp.lastName }}</td>
          <td>{{ emp.dob | date: 'dd-MM-yyyy' }}</td>
          <td>{{ emp.email }}</td>
          <td>{{ emp.position }}</td>
          <td>
            <button type="button" style="border: none;" (click)="editEmployee(emp)">
              <i class="fa-solid fa-pen"></i>
            </button>
            <button type="button" style="border: none;" (click)="deletePop(emp)">
                <i style="color: rgb(228, 68, 68);" class="fa-solid fa-trash"></i> 
            </button>

          </td>
        </tr>
        <tr *ngIf="filteredEmployees.length === 0">
          <td colspan="6" class="text-center">No employees found.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>


<!-- Delete Vehicle Modal -->
<div class="modal custom-modal fade" id="delete_vehicle" role="dialog">
  <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
          <div class="modal-body">
              <div class="modal-icon text-center mb-3">
                  <i class="fas fa-trash-alt text-danger"></i>
              </div>
              <div class="modal-text text-center">
                  <h4>Delete Employee</h4>
                  <div id="msg"></div>
              </div>
          </div>
          <div class="modal-footer text-center">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="button" class="btn btn-primary" (click)="deleteEmployee(OneEmployee)"  data-bs-dismiss="modal">Delete</button>
          </div>
      </div>
  </div>
</div>

<app-add-employee *ngIf="FormVisible" [EmpInfo] = "OneEmployee"></app-add-employee>
